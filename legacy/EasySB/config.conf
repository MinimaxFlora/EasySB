# ==============================================================================
#  EasySB v2 无交互安装配置模板 / non-interactive install template
#  项目地址 Homepage : https://github.com/MinimaxFlora/EasySB
# ==============================================================================
# 用法 / Usage:
#   bash easysb.sh --config config.conf
#
# 所有变量均为可选，缺省时脚本按内置默认值处理。
# Every variable is optional; built-in defaults apply when omitted.
# ==============================================================================

# 语言 / Language: C=简体中文, E=English
LANGUAGE='C'

# 内核通道 / Core channel: stable | alpha
CORE_CHANNEL='stable'

# 服务器公网地址，留空自动探测 / Public address, auto-detected if empty
SERVER_IP=''

# 证书域名，留空则使用自签占位证书 / Certificate domain, self-signed if empty
DOMAIN=''
CERT_DOMAIN=''

# 共享凭据，留空自动生成 / Shared credentials, auto-generated if empty
UUID=''
PASSWORD=''

# 协议开关 / Protocol switches
IS_ANYTLS='true'
IS_HYSTERIA2='true'
IS_TUIC='true'
IS_VLESS_REALITY='true'
IS_VMESS_WS_TLS='true'

# 协议端口 / Protocol ports
PORT_ANYTLS='8000'
PORT_HYSTERIA2='8001'
PORT_TUIC='8002'
PORT_VLESS_REALITY='8003'
PORT_VMESS_WS_TLS='8004'

# Hysteria2 端口跳跃范围 / Hysteria2 port-hopping range
HY2_HOP_RANGE='2080:3000'

# Reality 偷用域名 / Reality handshake SNI
REALITY_SNI='apple.com'
# Reality 密钥，留空由内核生成 / Reality keypair, generated by core if empty
REALITY_PRIVATE=''
REALITY_PUBLIC=''
REALITY_SHORT_ID=''

# 订阅服务 / Subscription endpoint
SUB_PORT='8443'
SUB_PATH='/subscribe'
