# EasySB mihomo (Clash Meta) subscription template.
#
# This file is embedded by internal/subscribe/mihomo.go and rendered with
# text/template; the proxies and proxy node lists are substituted from the node
# state. templates/config/mihomo.yaml is the readable mirror with sample data.
# Do not put template actions in comments: they are still expanded.
#
# Bind on localhost only: the subscription document itself is served by nginx,
# this mixed-port is what the client opens after importing the profile.

mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

proxies:
{{ .Proxies }}
proxy-groups:
  - name: proxy
    type: select
    proxies:
      - auto
{{ .Nodes }}
  - name: auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
{{ .Nodes }}
rules:
  - GEOIP,CN,DIRECT
  - MATCH,proxy
