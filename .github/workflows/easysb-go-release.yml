name: Build EasySB Go binary

# 源码：根目录 Go module（main.go、internal/**）
# 产物：easysb-linux-<arch> 静态二进制，以固定 tag `easysb-go` 发布
# 安装：bash install.sh（默认优先下载该 tag 下的二进制，失败时回退源码构建）

on:
  push:
    branches:
      - master
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - 'install.sh'
      - '.github/workflows/easysb-go-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  RELEASE_TAG: easysb-go

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go 使用 GOARCH=arm + GOARM=7 表示 armv7，资产名仍按终端习惯写作 armv7
          # Go spells armv7 as GOARCH=arm with GOARM=7; the asset keeps the armv7 name.
          - goarch: amd64
            asset: amd64
          - goarch: arm64
            asset: arm64
          - goarch: arm
            goarm: '7'
            asset: armv7
          - goarch: '386'
            asset: '386'
          - goarch: riscv64
            asset: riscv64
          - goarch: s390x
            asset: s390x
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 读取版本
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: 单元测试
        run: go test ./...

      - name: 交叉编译 linux/${{ matrix.asset }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o "dist/easysb-linux-${{ matrix.asset }}" .
          ls -lh "dist/easysb-linux-${{ matrix.asset }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: easysb-linux-${{ matrix.asset }}
          path: dist/easysb-linux-${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 下载全部产物
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: 发布到 Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: EasySB Go (${{ github.sha }})
          make_latest: false
          body: |
            > EasySB Go 版二进制 / EasySB Go binaries

            - 项目地址 / Homepage: https://github.com/MinimaxFlora/EasySB
            - 内核来源 / Core source: https://github.com/SagerNet/sing-box

            安装 / Install:

            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/MinimaxFlora/EasySB/master/install.sh)
            ```
          files: dist/easysb-linux-*
