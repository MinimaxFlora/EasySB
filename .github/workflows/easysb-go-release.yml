name: Build EasySB Go release

# 源码：根目录 Go module（main.go、internal/**）
# 产物：easysb-linux-<arch> 静态二进制，以 tag `v<VERSION>` 发布
# 安装：bash install.sh（默认优先下载该 tag 下的二进制，失败时回退源码构建）

on:
  push:
    branches:
      - master
    paths:
      - 'main.go'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - 'install.sh'
      - '.github/workflows/easysb-go-release.yml'
  workflow_dispatch:

permissions:
  contents: write

# Only the newest commit may publish, so an older run can never overwrite the
# release assets after a newer one.
concurrency:
  group: easysb-go-release
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  # The sing-box features this panel is built with. with_v2ray_api is what the
  # per-account counters read; without it sing-box rejects a config naming
  # experimental.v2ray_api whole. with_naive_outbound is deliberately absent: it needs
  # the Chromium/cronet toolchain, and a server panel does not use that outbound.
  TAGS: with_quic,with_grpc,with_utls,with_v2ray_api

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go 使用 GOARCH=arm + GOARM=7 表示 armv7，资产名仍按终端习惯写作 armv7
          # Go spells armv7 as GOARCH=arm with GOARM=7; the asset keeps the armv7 name.
          - goarch: amd64
            asset: amd64
          - goarch: arm64
            asset: arm64
          - goarch: arm
            goarm: '7'
            asset: armv7
          - goarch: '386'
            asset: '386'
          - goarch: riscv64
            asset: riscv64
          - goarch: s390x
            asset: s390x
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 读取版本
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: 读取内置内核版本 / read the bundled core version
        id: core
        run: |
          set -euo pipefail
          echo "version=$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: 单元测试
        run: |
          set -euo pipefail
          go test ./...
          go test -tags "$TAGS" ./...

      - name: 交叉编译 linux/${{ matrix.asset }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          # 内核编进面板：sing-box 的库随本模块编译，版本由 go.mod 钉住并注入 constant.Version，
          # 因此发布出来的二进制自带内核，装完不需要另外下载。
          # The core is compiled into the panel: sing-box's library comes from this
          # module's go.mod, and its version is injected the way upstream does it, so a
          # released binary carries a node and installs nothing else.
          go build -trimpath -tags "$TAGS" \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }} -X main.commit=${GITHUB_SHA} -X github.com/sagernet/sing-box/constant.Version=${{ steps.core.outputs.version }}" \
            -o "dist/easysb-linux-${{ matrix.asset }}" .
          ls -lh "dist/easysb-linux-${{ matrix.asset }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: easysb-linux-${{ matrix.asset }}
          path: dist/easysb-linux-${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 读取版本
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: 发布到 Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.ver.outputs.version }}
          name: EasySB Go v${{ steps.ver.outputs.version }}
          make_latest: false
          body: |
            > EasySB Go v${{ steps.ver.outputs.version }} 二进制 / binaries

            - 项目地址 / Homepage: https://github.com/MinimaxFlora/EasySB
            - 内核来源 / Core source: https://github.com/SagerNet/sing-box

            安装 / Install:

            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/MinimaxFlora/EasySB/master/install.sh)
            ```
          files: dist/easysb-linux-*
