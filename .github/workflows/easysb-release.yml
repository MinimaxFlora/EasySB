name: Build EasySB script

# 源码：EasySB/lib/*.sh（按功能拆分的模块，带完整注释，便于阅读与维护）
# 产物：EasySB/dist/easysb.sh（由 EasySB/build.sh 合成，仅在 Actions 运行器中生成）
# 发布：以固定 tag `easysb` 发布 release 资产 easysb.sh，供安装与 [sb] 快捷指令拉取

on:
  push:
    branches:
      - master
    paths:
      - 'EasySB/lib/**'
      - 'EasySB/build.sh'
      - 'EasySB/config.conf'
      - '.github/workflows/easysb-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  RELEASE_TAG: easysb
  SCRIPT_NAME: easysb.sh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 合成发行脚本 EasySB/dist/easysb.sh
        run: |
          set -euo pipefail
          bash EasySB/build.sh
          [ -f "EasySB/dist/${SCRIPT_NAME}" ] || { echo "::error::未生成 EasySB/dist/${SCRIPT_NAME}"; exit 1; }
          SCRIPT_VERSION="$(grep -m1 '^VERSION=' EasySB/lib/00-header.sh | cut -d"'" -f2)"
          echo "SCRIPT_VERSION=${SCRIPT_VERSION}" >> "$GITHUB_ENV"
          echo "已生成 EasySB/dist/${SCRIPT_NAME}（版本：${SCRIPT_VERSION}）"

      - name: 运行测试
        run: |
          set -euo pipefail
          bash EasySB/tests/run-tests.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: easysb-script
          path: EasySB/dist/easysb.sh
          if-no-files-found: error

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: EasySB Script (${{ env.SCRIPT_VERSION }})
          make_latest: false
          body: |
            > EasySB 一键部署脚本 / EasySB one-click deployment script

            - 脚本版本 / Version: `${{ env.SCRIPT_VERSION }}`
            - 项目地址 / Homepage: https://github.com/MinimaxFlora/EasySB
            - 参考项目 / Reference: https://github.com/fscarmen/sing-box

            安装 / Install:

            ```bash
            bash <(curl -fsSL https://github.com/MinimaxFlora/EasySB/releases/download/easysb/easysb.sh)
            ```
          files: EasySB/dist/easysb.sh
