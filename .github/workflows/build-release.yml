name: 编译 sing-box

on:
  # 每天北京时间 11:00 和 04:00 自动检测上游更新
  schedule:
    - cron: "0 3,20 * * *"

  workflow_dispatch:
    inputs:
      branch:
        description: "指定编译的版本号，例如 v1.12.0；留空则自动获取最新版本"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai

jobs:

  # ============================================================
  # 检查版本
  # ============================================================
  check:
    name: 检查 sing-box 版本
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.getversion.outputs.tag }}
      ver: ${{ steps.getversion.outputs.ver }}
      should_build: ${{ steps.getversion.outputs.should_build }}

    steps:
      - name: 获取版本号
        id: getversion
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "检查 SagerNet/sing-box 最新版本"
          echo "========================================"

          # 获取上游最新 Release
          UPSTREAM_TAG=$(curl -sL \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '.tag_name // empty')

          # 获取当前仓库最新 Release
          #
          # 第一次构建时本仓库没有 Release：
          # GitHub API 会返回 404，但普通 curl 不会因此退出。
          # jq 最终得到空值。
          LOCAL_TAG=$(curl -sL \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | jq -r '.tag_name // empty')

          INPUT_TAG="${{ github.event.inputs.branch }}"

          echo "========================================"
          echo "上游最新版本：${UPSTREAM_TAG}"
          echo "当前仓库版本：${LOCAL_TAG:-无 Release}"
          echo "手动指定版本：${INPUT_TAG:-无}"
          echo "========================================"

          # 防止 GitHub API 异常导致错误版本继续编译
          if [[ -z "${UPSTREAM_TAG}" && -z "${INPUT_TAG}" ]]; then
            echo "::error::无法获取 SagerNet/sing-box 最新版本"
            exit 1
          fi

          # 手动指定版本
          if [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
            SHOULD_BUILD=true

            echo "使用手动指定版本：${TAG}"

          # 第一次构建
          elif [[ -z "${LOCAL_TAG}" ]]; then
            TAG="${UPSTREAM_TAG}"
            SHOULD_BUILD=true

            echo "当前仓库没有 Release"
            echo "开始首次构建：${TAG}"

          # 上游有新版本
          elif [[ "${UPSTREAM_TAG}" != "${LOCAL_TAG}" ]]; then
            TAG="${UPSTREAM_TAG}"
            SHOULD_BUILD=true

            echo "检测到新版本：${LOCAL_TAG} -> ${TAG}"

          # 已经是最新版本
          else
            TAG="${UPSTREAM_TAG}"
            SHOULD_BUILD=false

            echo "当前已经是最新版本，无需构建"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${LOCAL_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      # 删除旧 Actions 运行记录
      # 注意：这里只删除 Workflow Run，不会创建任何提交。
      - name: 删除旧流程记录
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 0


  # ============================================================
  # 编译
  # ============================================================
  build:
    name: 构建 ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}

    needs: check

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      max-parallel: 13

      matrix:
        include:

          # ----------------------------------------------------
          # Linux amd64
          # ----------------------------------------------------
          - os: linux
            arch: amd64
            variant: purego
            naive: true

          - os: linux
            arch: amd64
            variant: glibc
            naive: true

          - os: linux
            arch: amd64
            variant: musl
            naive: true
            debian: amd64

          # ----------------------------------------------------
          # Linux arm64
          # ----------------------------------------------------
          - os: linux
            arch: arm64
            variant: purego
            naive: true

          - os: linux
            arch: arm64
            variant: glibc
            naive: true

          - os: linux
            arch: arm64
            variant: musl
            naive: true
            debian: arm64

          # ----------------------------------------------------
          # Linux 386
          # ----------------------------------------------------
          - os: linux
            arch: "386"
            go386: sse2

          - os: linux
            arch: "386"
            variant: glibc
            naive: true
            go386: sse2

          - os: linux
            arch: "386"
            variant: musl
            naive: true
            go386: sse2
            debian: i386

          # ----------------------------------------------------
          # Linux ARM
          # ----------------------------------------------------
          - os: linux
            arch: arm
            goarm: "7"

          - os: linux
            arch: arm
            variant: glibc
            naive: true
            goarm: "7"

          - os: linux
            arch: arm
            variant: musl
            naive: true
            goarm: "7"
            debian: armhf

          # ARMv5
          - os: linux
            arch: arm
            goarm: "5"

          # ARMv6
          - os: linux
            arch: arm
            goarm: "6"
            debian: armel

          # ----------------------------------------------------
          # Linux mips
          # ----------------------------------------------------
          - os: linux
            arch: mips
            gomips: softfloat

          # ----------------------------------------------------
          # Linux mipsle
          # ----------------------------------------------------
          - os: linux
            arch: mipsle
            gomips: hardfloat
            variant: glibc
            naive: true

          - os: linux
            arch: mipsle
            gomips: softfloat
            variant: musl
            naive: true
            debian: mipsel

          # ----------------------------------------------------
          # Linux mips64
          # ----------------------------------------------------
          - os: linux
            arch: mips64
            gomips: softfloat

          # ----------------------------------------------------
          # Linux mips64le
          # ----------------------------------------------------
          - os: linux
            arch: mips64le
            gomips: hardfloat
            variant: glibc
            naive: true

          - os: linux
            arch: mips64le
            gomips: softfloat
            variant: musl
            naive: true
            debian: mips64el

          # ----------------------------------------------------
          # Linux riscv64
          # ----------------------------------------------------
          - os: linux
            arch: riscv64
            naive: true
            variant: glibc

          - os: linux
            arch: riscv64
            naive: true
            variant: musl
            debian: riscv64

          # ----------------------------------------------------
          # Linux loong64
          # ----------------------------------------------------
          - os: linux
            arch: loong64
            naive: true
            variant: glibc

          - os: linux
            arch: loong64
            naive: true
            variant: musl
            debian: loongarch64

          # ----------------------------------------------------
          # Linux s390x
          # ----------------------------------------------------
          - os: linux
            arch: s390x
            debian: s390x

          # ----------------------------------------------------
          # Linux ppc64le
          # ----------------------------------------------------
          - os: linux
            arch: ppc64le
            debian: ppc64el

          # ----------------------------------------------------
          # Windows amd64
          # ----------------------------------------------------
          - os: windows
            arch: amd64

          # ----------------------------------------------------
          # Windows 386
          # ----------------------------------------------------
          - os: windows
            arch: "386"

    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      GO386: ${{ matrix.go386 }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}

    steps:

      # --------------------------------------------------------
      # 检出本仓库
      # --------------------------------------------------------
      - name: 检出仓库
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 安装 Go
      # --------------------------------------------------------
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false

      # --------------------------------------------------------
      # 获取 sing-box 源码
      # --------------------------------------------------------
      - name: 获取 sing-box 源码
        shell: bash
        run: |
          set -e

          TAG="${{ needs.check.outputs.tag }}"

          echo "========================================"
          echo "准备构建 sing-box"
          echo "版本：${TAG}"
          echo "系统：${{ matrix.os }}"
          echo "架构：${{ matrix.arch }}"
          echo "变体：${{ matrix.variant || 'default' }}"
          echo "========================================"

          git clone \
            --depth 1 \
            --branch "${TAG}" \
            https://github.com/SagerNet/sing-box.git \
            /opt/sing-box

      # --------------------------------------------------------
      # 准备构建环境
      # --------------------------------------------------------
      - name: 安装构建依赖
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            file \
            jq

          # musl 构建
          if [[ "${{ matrix.variant }}" == "musl" ]]; then
            sudo apt-get install -y musl-tools
          fi

      # --------------------------------------------------------
      # 编译
      # --------------------------------------------------------
      - name: 编译 sing-box
        shell: bash
        working-directory: /opt/sing-box
        run: |
          set -e

          VERSION="${{ needs.check.outputs.tag }}"

          mkdir -p dist

          # 使用官方 sing-box 构建参数
          BUILD_TAGS="$(go run -v ./cmd/internal/read_tag --ci)"

          LDFLAGS="$(go run -v ./cmd/internal/read_tag --ci --ldflags)"

          echo "========================================"
          echo "版本：${VERSION}"
          echo "GOOS：${GOOS}"
          echo "GOARCH：${GOARCH}"
          echo "GO386：${GO386}"
          echo "GOARM：${GOARM}"
          echo "GOMIPS：${GOMIPS}"
          echo "Variant：${{ matrix.variant }}"
          echo "========================================"

          # ----------------------------------------------------
          # 默认 / purego
          # ----------------------------------------------------
          if [[ -z "${{ matrix.variant }}" || "${{ matrix.variant }}" == "purego" ]]; then

            export CGO_ENABLED=0

            go build \
              -v \
              -trimpath \
              -tags "${BUILD_TAGS}" \
              -ldflags "${LDFLAGS} -X github.com/sagernet/sing-box/constant.Version=${VERSION}" \
              -o "dist/sing-box-${VERSION}-${GOOS}-${GOARCH}"

          # ----------------------------------------------------
          # glibc
          # ----------------------------------------------------
          elif [[ "${{ matrix.variant }}" == "glibc" ]]; then

            export CGO_ENABLED=1

            go build \
              -v \
              -trimpath \
              -tags "${BUILD_TAGS}" \
              -ldflags "${LDFLAGS} -X github.com/sagernet/sing-box/constant.Version=${VERSION}" \
              -o "dist/sing-box-${VERSION}-${GOOS}-${GOARCH}-glibc"

          # ----------------------------------------------------
          # musl
          # ----------------------------------------------------
          elif [[ "${{ matrix.variant }}" == "musl" ]]; then

            export CGO_ENABLED=1

            if [[ "${GOOS}" == "linux" && "${GOARCH}" == "amd64" ]]; then
              export CC=musl-gcc
            fi

            go build \
              -v \
              -trimpath \
              -tags "${BUILD_TAGS}" \
              -ldflags "${LDFLAGS} -X github.com/sagernet/sing-box/constant.Version=${VERSION}" \
              -o "dist/sing-box-${VERSION}-${GOOS}-${GOARCH}-musl"

          fi

      # --------------------------------------------------------
      # 文件检查
      # --------------------------------------------------------
      - name: 检查构建文件
        shell: bash
        working-directory: /opt/sing-box
        run: |
          set -e

          echo "========================================"
          echo "构建产物"
          echo "========================================"

          find dist -type f -maxdepth 1 -print

          echo
          echo "========================================"
          echo "文件类型"
          echo "========================================"

          file dist/*

          echo
          echo "========================================"
          echo "文件大小"
          echo "========================================"

          du -h dist/*

      # --------------------------------------------------------
      # 创建 DEB
      # --------------------------------------------------------
      - name: 创建 Debian DEB
        if: matrix.debian != ''
        shell: bash
        working-directory: /opt/sing-box
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential

          sudo gem install --no-document fpm

          VERSION="${{ needs.check.outputs.tag }}"
          DEB_ARCH="${{ matrix.debian }}"

          case "${{ matrix.arch }}-${{ matrix.variant }}" in
            amd64-musl)
              BINARY="dist/sing-box-${VERSION}-linux-amd64-musl"
              ;;
            arm64-musl)
              BINARY="dist/sing-box-${VERSION}-linux-arm64-musl"
              ;;
            386-musl)
              BINARY="dist/sing-box-${VERSION}-linux-386-musl"
              ;;
            arm-musl)
              BINARY="dist/sing-box-${VERSION}-linux-arm-musl"
              ;;
            mipsle-musl)
              BINARY="dist/sing-box-${VERSION}-linux-mipsle-musl"
              ;;
            mips64le-musl)
              BINARY="dist/sing-box-${VERSION}-linux-mips64le-musl"
              ;;
            riscv64-musl)
              BINARY="dist/sing-box-${VERSION}-linux-riscv64-musl"
              ;;
            loong64-musl)
              BINARY="dist/sing-box-${VERSION}-linux-loong64-musl"
              ;;
            *)
              echo "当前架构没有对应的 DEB binary：${{ matrix.arch }}-${{ matrix.variant }}"
              exit 1
              ;;
          esac

          test -f "${BINARY}"

          mkdir -p /tmp/sing-box-deb

          # ----------------------------------------------------
          # 安装官方 Release 资源
          # ----------------------------------------------------

          mkdir -p \
            /tmp/sing-box-deb/usr/bin \
            /tmp/sing-box-deb/usr/lib/systemd/system \
            /tmp/sing-box-deb/usr/lib/sysusers.d \
            /tmp/sing-box-deb/usr/lib/udev/rules.d \
            /tmp/sing-box-deb/usr/share/bash-completion/completions \
            /tmp/sing-box-deb/usr/share/fish/vendor_completions.d \
            /tmp/sing-box-deb/usr/share/zsh/vendor-completions \
            /tmp/sing-box-deb/usr/share/doc/sing-box

          cp "${BINARY}" \
            /tmp/sing-box-deb/usr/bin/sing-box

          chmod 755 \
            /tmp/sing-box-deb/usr/bin/sing-box

          # systemd
          if [[ -f "${GITHUB_WORKSPACE}/Release/sing-box.service" ]]; then
            cp "${GITHUB_WORKSPACE}/Release/sing-box.service" \
              /tmp/sing-box-deb/usr/lib/systemd/system/
          fi

          if [[ -f "${GITHUB_WORKSPACE}/Release/sing-box@.service" ]]; then
            cp "${GITHUB_WORKSPACE}/Release/sing-box@.service" \
              /tmp/sing-box-deb/usr/lib/systemd/system/
          fi

          # sysusers
          if [[ -f "${GITHUB_WORKSPACE}/Release/sing-box.sysusers" ]]; then
            cp "${GITHUB_WORKSPACE}/Release/sing-box.sysusers" \
              /tmp/sing-box-deb/usr/lib/sysusers.d/sing-box.conf
          fi

          # udev rules
          if [[ -f "${GITHUB_WORKSPACE}/Release/sing-box.rules" ]]; then
            cp "${GITHUB_WORKSPACE}/Release/sing-box.rules" \
              /tmp/sing-box-deb/usr/lib/udev/rules.d/99-sing-box.rules
          fi

          # bash completion
          if [[ -f "${GITHUB_WORKSPACE}/Release/sing-box.bash" ]]; then
            cp "${GITHUB_WORKSPACE}/Release/sing-box.bash" \
              /tmp/sing-box-deb/usr/share/bash-completion/completions/sing-box
          fi

          # fish completion
          if [[ -f "${GITHUB_WORKSPACE}/Release/sing-box.fish" ]]; then
            cp "${GITHUB_WORKSPACE}/Release/sing-box.fish" \
              /tmp/sing-box-deb/usr/share/fish/vendor_completions.d/sing-box.fish
          fi

          # zsh completion
          if [[ -f "${GITHUB_WORKSPACE}/Release/sing-box.zsh" ]]; then
            cp "${GITHUB_WORKSPACE}/Release/sing-box.zsh" \
              /tmp/sing-box-deb/usr/share/zsh/vendor-completions/_sing-box
          fi

          # LICENSE
          if [[ -f "${GITHUB_WORKSPACE}/Release/LICENSE" ]]; then
            cp "${GITHUB_WORKSPACE}/Release/LICENSE" \
              /tmp/sing-box-deb/usr/share/doc/sing-box/LICENSE
          fi

          # split DNS
          if [[ -f "${GITHUB_WORKSPACE}/Release/sing-box-split-dns.xml" ]]; then
            mkdir -p /tmp/sing-box-deb/usr/share/sing-box

            cp "${GITHUB_WORKSPACE}/Release/sing-box-split-dns.xml" \
              /tmp/sing-box-deb/usr/share/sing-box/
          fi

          # ----------------------------------------------------
          # FPM
          # ----------------------------------------------------

          PKG_VERSION="${VERSION#v}"

          fpm \
            -s dir \
            -t deb \
            --name sing-box \
            --version "${PKG_VERSION}" \
            --architecture "${DEB_ARCH}" \
            --description "The universal proxy platform" \
            --license GPL-3.0 \
            --url "https://github.com/SagerNet/sing-box" \
            --maintainer "SagerNet" \
            --after-install "${GITHUB_WORKSPACE}/Release/sing-box.postinst" \
            -C /tmp/sing-box-deb \
            -p "dist/sing-box_${PKG_VERSION}_${DEB_ARCH}.deb" \
            .

          echo "========================================"
          echo "DEB 构建完成"
          echo "========================================"

          ls -lh dist/*.deb

      # --------------------------------------------------------
      # 上传 Artifact
      # --------------------------------------------------------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ needs.check.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.variant || 'default' }}
          path: |
            /opt/sing-box/dist/*
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # 汇总所有构建产物
  # ============================================================
  collect:
    name: 汇总构建产物
    needs:
      - check
      - build

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-24.04

    steps:

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: sing-box-${{ needs.check.outputs.tag }}-*
          merge-multiple: true

      - name: 整理文件
        shell: bash
        run: |
          set -e

          mkdir -p release

          find dist -type f -print

          # 把所有构建产物移动到 Release 目录
          find dist -type f -exec cp {} release/ \;

          # 删除重复的文件名冲突
          find release -type f -printf '%f\n' | sort

      - name: 生成 SHA256
        shell: bash
        working-directory: release
        run: |
          set -e

          sha256sum * > sha256sums.txt

          echo "========================================"
          echo "SHA256"
          echo "========================================"

          cat sha256sums.txt

      - name: 生成构建信息
        shell: bash
        working-directory: release
        run: |
          set -e

          BUILD_TIME="$(date '+%Y-%m-%d %H:%M:%S %Z')"
          VERSION="${{ needs.check.outputs.tag }}"

          cat > build-info.txt <<EOF
          Project: sing-box
          Version: ${VERSION}
          Build Time: ${BUILD_TIME}
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          EOF

          echo "========================================"
          cat build-info.txt
          echo "========================================"

      - name: 上传最终 Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-release-${{ needs.check.outputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # 发布 Release
  # ============================================================
  release:
    name: 发布 Release
    needs:
      - check
      - collect

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-24.04

    steps:

      - name: 下载最终构建产物
        uses: actions/download-artifact@v4
        with:
          name: sing-box-release-${{ needs.check.outputs.tag }}
          path: release

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.check.outputs.tag }}
          name: sing-box ${{ needs.check.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## sing-box ${{ needs.check.outputs.tag }}

            基于官方 SagerNet/sing-box ${{ needs.check.outputs.tag }} 构建。

            ### 支持平台

            **Linux**
            - amd64
            - arm64
            - 386
            - arm
            - mips
            - mipsle
            - mips64
            - mips64le
            - riscv64
            - loong64
            - s390x
            - ppc64le

            **Windows**
            - amd64
            - 386

            **Debian**
            - amd64
            - arm64
            - i386
            - armhf
            - armel
            - mipsel
            - mips64el
            - riscv64
            - loongarch64
            - s390x
            - ppc64el

            ### 构建说明

            本 Release 基于：

            https://github.com/SagerNet/sing-box

            构建时间：

            ${{ github.event.head_commit.timestamp }}

            ### SHA256

            详见 `sha256sums.txt`。


  # ============================================================
  # 清理 Workflow Runs
  # ============================================================
  cleanup:
    name: 清理旧 Workflow Runs
    needs:
      - release

    if: always()

    runs-on: ubuntu-24.04

    steps:
      - name: 删除旧流程记录
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 0
