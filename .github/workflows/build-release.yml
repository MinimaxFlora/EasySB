name: 编译 sing-box

on:
  schedule:
    - cron: "0 3,20 * * *"

  workflow_dispatch:
    inputs:
      branch:
        description: "指定编译版本，例如 1.14.1 或 v1.14.1；留空自动检测最新版本"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: sing-box-build
  cancel-in-progress: false

jobs:
  check:
    name: 检查版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.getversion.outputs.tag }}
      version: ${{ steps.getversion.outputs.version }}
      local_tag: ${{ steps.getversion.outputs.local_tag }}
      should_build: ${{ steps.getversion.outputs.should_build }}
    steps:
      - name: 获取版本
        id: getversion
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_TAG="$(
            curl -sSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/SagerNet/sing-box/releases/latest" \
              | jq -r '.tag_name // empty'
          )"

          LOCAL_TAG="$(
            curl -sSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
              | jq -r '.tag_name // empty'
          )"

          INPUT_VERSION="${{ inputs.branch }}"

          echo "上游最新版本：${UPSTREAM_TAG:-获取失败}"
          echo "当前仓库版本：${LOCAL_TAG:-无 Release}"
          echo "手动指定版本：${INPUT_VERSION:-无}"

          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
            SHOULD_BUILD=true
          elif [[ -z "${LOCAL_TAG}" ]]; then
            [[ -n "${UPSTREAM_TAG}" ]] || { echo "::error::无法获取 SagerNet/sing-box 最新版本"; exit 1; }
            TAG="${UPSTREAM_TAG}"
            VERSION="${TAG#v}"
            SHOULD_BUILD=true
          elif [[ "${UPSTREAM_TAG}" != "${LOCAL_TAG}" ]]; then
            TAG="${UPSTREAM_TAG}"
            VERSION="${TAG#v}"
            SHOULD_BUILD=true
          else
            TAG="${UPSTREAM_TAG}"
            VERSION="${TAG#v}"
            SHOULD_BUILD=false
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "local_tag=${LOCAL_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      - name: 删除旧流程记录
        uses: Mattraks/delete-workflow-runs@v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 7
          keep_minimum_runs: 20

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}{{ matrix.goarm && format('-arm{0}', matrix.goarm) || '' }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          - { os: linux, arch: amd64, build_tags: default }
          - { os: linux, arch: arm64, build_tags: default }
          - { os: linux, arch: "386", build_tags: others, go386: sse2 }
          - { os: linux, arch: arm, build_tags: others, goarm: "7" }
          - { os: linux, arch: arm, build_tags: others, goarm: "6" }
          - { os: linux, arch: mips, build_tags: others, gomips: hardfloat }
          - { os: linux, arch: mipsle, build_tags: others, gomips: hardfloat }
          - { os: linux, arch: mips64, build_tags: others, gomips64: hardfloat }
          - { os: linux, arch: mips64le, build_tags: others, gomips64: hardfloat }
          - { os: linux, arch: riscv64, build_tags: others }
          - { os: linux, arch: loong64, build_tags: others }
          - { os: linux, arch: s390x, build_tags: others }
          - { os: linux, arch: ppc64le, build_tags: others }
          - { os: windows, arch: amd64, build_tags: windows }
          - { os: windows, arch: "386", build_tags: others }

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.8"
          cache: false

      - name: 获取 sing-box
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ needs.check.outputs.tag }}" \
            https://github.com/SagerNet/sing-box.git sing-box

      - name: 安装 Linux 构建依赖
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file jq git curl

      - name: 设置官方 Build Tags
        shell: bash
        working-directory: sing-box
        run: |
          set -euo pipefail
          case "${{ matrix.build_tags }}" in
            default) TAGS="$(cat release/DEFAULT_BUILD_TAGS),with_purego" ;;
            others) TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" ;;
            windows) TAGS="$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)" ;;
            *) echo "::error::未知 build_tags：${{ matrix.build_tags }}"; exit 1 ;;
          esac
          echo "BUILD_TAGS=${TAGS}" >> "$GITHUB_ENV"
          echo "BUILD_TAGS=${TAGS}"

      - name: 设置官方 LDFLAGS
        shell: bash
        working-directory: sing-box
        run: |
          set -euo pipefail
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: 编译 Linux
        if: matrix.os == 'linux'
        shell: bash
        working-directory: sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GO386: ${{ matrix.go386 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips64 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ needs.check.outputs.version }}"
          OUTPUT="sing-box-${VERSION}-linux-${GOARCH}"
          [[ -z "${GOARM:-}" ]] || OUTPUT="${OUTPUT}-arm${GOARM}"
          go build -v -trimpath -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/${OUTPUT}" ./cmd/sing-box

          if [[ "${GOARCH}" == "amd64" || "${GOARCH}" == "arm64" ]]; then
            CRONET_GO_VERSION="$(cat .github/CRONET_GO_VERSION)"
            LIBRARY_PATH="lib/linux_${GOARCH}/libcronet.so"
            rm -rf "$RUNNER_TEMP/cronet-go-lib"
            git init "$RUNNER_TEMP/cronet-go-lib"
            git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/SagerNet/cronet-go.git
            git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/${LIBRARY_PATH}"
            git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
            git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
            cp "$RUNNER_TEMP/cronet-go-lib/${LIBRARY_PATH}" dist/libcronet.so
            chmod 0755 dist/libcronet.so
          fi

      - name: 编译 Windows
        if: matrix.os == 'windows'
        shell: bash
        working-directory: sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${{ needs.check.outputs.version }}"
          OUTPUT="sing-box-${VERSION}-windows-${GOARCH}.exe"
          go build -v -trimpath -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/${OUTPUT}" ./cmd/sing-box

          if [[ "${GOARCH}" == "amd64" ]]; then
            CRONET_GO_VERSION="$(cat .github/CRONET_GO_VERSION)"
            LIBRARY_PATH="lib/windows_amd64/libcronet.dll"
            rm -rf "$RUNNER_TEMP/cronet-go-lib"
            git init "$RUNNER_TEMP/cronet-go-lib"
            git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/SagerNet/cronet-go.git
            git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/${LIBRARY_PATH}"
            git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
            git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
            cp "$RUNNER_TEMP/cronet-go-lib/${LIBRARY_PATH}" dist/libcronet.dll
          fi

      - name: 检查构建产物
        shell: bash
        working-directory: sing-box
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print
          file dist/*
          du -h dist/*
          sha256sum dist/*

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ needs.check.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}{{ matrix.goarm && format('-arm{0}', matrix.goarm) || '' }}
          path: sing-box/dist/*
          if-no-files-found: error
          retention-days: 7

  deb:
    name: 构建并签名 Debian DEB (${{ matrix.debian }})
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, debian: amd64 }
          - { arch: arm64, debian: arm64 }
          - { arch: "386", debian: i386 }
          - { arch: arm, goarm: "7", debian: armhf }
          - { arch: arm, goarm: "6", debian: armel }
          - { arch: mipsle, debian: mipsel }
          - { arch: mips64le, debian: mips64el }
          - { arch: riscv64, debian: riscv64 }
          - { arch: loong64, debian: loongarch64 }
          - { arch: s390x, debian: s390x }
          - { arch: ppc64le, debian: ppc64el }

    steps:
      - name: 检出 Release 资源
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            Release
          sparse-checkout-cone-mode: true

      - name: 下载对应架构构建产物
        uses: actions/download-artifact@v8.0.1
        with:
          name: sing-box-${{ needs.check.outputs.version }}-linux-${{ matrix.arch }}{{ matrix.goarm && format('-arm{0}', matrix.goarm) || '' }}
          path: input

      - name: 安装依赖 (FPM & debsigs)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential debsigs gnupg
          sudo gem install --no-document fpm

      - name: 导入 GPG 密钥
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: 创建并签名 DEB
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.check.outputs.version }}"
          DEB_VERSION="${VERSION//-/~}"

          rm -rf package dist
          mkdir -p package/usr/bin dist

          BINARY="$(find input -maxdepth 1 -type f -name 'sing-box-*' ! -name '*.deb' | head -n 1)"
          [[ -n "${BINARY}" ]] || { echo "::error::没有找到 sing-box 二进制"; find input -type f -print; exit 1; }
          cp "${BINARY}" package/usr/bin/sing-box
          chmod 0755 package/usr/bin/sing-box

          if [[ "${{ matrix.arch }}" == "amd64" || "${{ matrix.arch }}" == "arm64" ]]; then
            CRONET="$(find input -maxdepth 1 -type f -name 'libcronet.so' | head -n 1)"
            [[ -n "${CRONET}" ]] || { echo "::error::${{ matrix.arch }} 缺少 libcronet.so"; find input -type f -print; exit 1; }
            mkdir -p package/usr/lib
            cp "${CRONET}" package/usr/lib/libcronet.so
            chmod 0755 package/usr/lib/libcronet.so
          fi

          POSTINST=""
          if [[ -f Release/sing-box.postinst ]]; then
            chmod 0755 Release/sing-box.postinst
            POSTINST="--after-install Release/sing-box.postinst"
          fi

          SYSTEMD=""
          if [[ -f Release/.fpm_systemd ]]; then
            SYSTEMD="--deb-systemd Release/.fpm_systemd"
          fi

          fpm \
            -s dir \
            -t deb \
            --name sing-box \
            --version "${DEB_VERSION}" \
            --architecture "${{ matrix.debian }}" \
            --description "The universal proxy platform" \
            --license "GPL-3.0" \
            --url "https://github.com/SagerNet/sing-box" \
            --maintainer "SagerNet" \
            ${POSTINST} \
            ${SYSTEMD} \
            -C package \
            -p "sing-box_${DEB_VERSION}_${{ matrix.debian }}.deb" \
            .

          # 使用 debsigs 对生成的 DEB 包进行 GPG 签名
          debsigs --sign=origin --default-key "${{ secrets.GPG_KEY_ID }}" --passphrase "${{ secrets.GPG_PASSPHRASE }}" "sing-box_${DEB_VERSION}_${{ matrix.debian }}.deb"

          mv "sing-box_${DEB_VERSION}_${{ matrix.debian }}.deb" dist/
          file dist/*
          sha256sum dist/*

      - name: 上传 DEB
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sing-box-${{ needs.check.outputs.version }}-deb-${{ matrix.debian }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  collect:
    name: 汇总所有产物
    needs: [check, build, deb]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 下载 Linux
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: sing-box-${{ needs.check.outputs.version }}-linux-*
          path: release
          merge-multiple: true
      - name: 下载 Windows
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: sing-box-${{ needs.check.outputs.version }}-windows-*
          path: release
          merge-multiple: true
      - name: 下载 DEB
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: sing-box-${{ needs.check.outputs.version }}-deb-*
          path: release
          merge-multiple: true
      - name: 检查 Release 文件
        shell: bash
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f -printf '%f\n' | sort
          COUNT="$(find release -maxdepth 1 -type f | wc -l)"
          [[ "${COUNT}" -gt 0 ]] || { echo "::error::没有找到任何 Release 文件"; exit 1; }
      - name: 生成 SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum * > sha256sums.txt
      - name: 生成构建信息
        shell: bash
        run: |
          set -euo pipefail
          cat > release/build-info.txt <<EOF
          Project: sing-box
          Version: ${{ needs.check.outputs.tag }}
          Build Version: ${{ needs.check.outputs.version }}
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Build Time: $(date '+%Y-%m-%d %H:%M:%S %Z')
          EOF
      - name: 上传最终 Release Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sing-box-release-${{ needs.check.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 GitHub Release
    needs: [check, collect]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 下载最终产物
        uses: actions/download-artifact@v8.0.1
        with:
          name: sing-box-release-${{ needs.check.outputs.version }}
          path: release
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.check.outputs.tag }}
          name: sing-box ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*
          body: |
            # sing-box ${{ needs.check.outputs.tag }}

            基于官方 SagerNet/sing-box 构建（包含已签名的 Debian 软件包）。

            ## Linux
            - amd64（purego + libcronet.so）
            - arm64（purego + libcronet.so）
            - 386
            - armv7
            - armv6
            - mips
            - mipsle
            - mips64
            - mips64le
            - riscv64
            - loong64
            - s390x
            - ppc64le

            ## Windows
            - amd64（purego + libcronet.dll）
            - 386

            ## Debian (已使用 GPG 签名)
            - amd64
            - arm64
            - i386
            - armhf
            - armel
            - mipsel
            - mips64el
            - riscv64
            - loongarch64
            - s390x
            - ppc64el

            ## 校验
            SHA256：`sha256sums.txt`
