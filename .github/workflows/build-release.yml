name: 编译 sing-box

on:
  schedule:
    # UTC 03:00 / 20:00
    # 北京时间 11:00 / 次日 04:00
    - cron: "0 3,20 * * *"

  workflow_dispatch:
    inputs:
      branch:
        description: "指定编译版本，例如 1.14.1 或 v1.14.1；留空自动检测最新版本"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: sing-box-build
  cancel-in-progress: false

jobs:

  # ============================================================
  # 检查版本
  # ============================================================
  check:
    name: 检查版本
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.getversion.outputs.tag }}
      version: ${{ steps.getversion.outputs.version }}
      local_tag: ${{ steps.getversion.outputs.local_tag }}
      should_build: ${{ steps.getversion.outputs.should_build }}

    steps:
      - name: 获取版本
        id: getversion
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "检查 sing-box 版本"
          echo "========================================"

          # ------------------------------------------------------
          # 获取上游最新 Release
          # ------------------------------------------------------
          UPSTREAM_TAG="$(
            curl -sSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/SagerNet/sing-box/releases/latest" \
              | jq -r '.tag_name // empty'
          )"

          # ------------------------------------------------------
          # 获取当前仓库最新 Release
          #
          # 第一次运行时本仓库没有 Release。
          # GitHub API 返回 404，但这里不能使用 curl -f。
          # ------------------------------------------------------
          LOCAL_TAG="$(
            curl -sSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
              | jq -r '.tag_name // empty'
          )"

          INPUT_VERSION="${{ inputs.branch }}"

          echo "========================================"
          echo "上游最新版本：${UPSTREAM_TAG:-获取失败}"
          echo "当前仓库版本：${LOCAL_TAG:-无 Release}"
          echo "手动指定版本：${INPUT_VERSION:-无}"
          echo "========================================"

          # ------------------------------------------------------
          # 手动指定版本
          # ------------------------------------------------------
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
            SHOULD_BUILD=true

            echo "使用手动指定版本：${TAG}"

          # ------------------------------------------------------
          # 第一次构建
          # ------------------------------------------------------
          elif [[ -z "${LOCAL_TAG}" ]]; then

            if [[ -z "${UPSTREAM_TAG}" ]]; then
              echo "::error::无法获取 SagerNet/sing-box 最新版本"
              exit 1
            fi

            TAG="${UPSTREAM_TAG}"
            VERSION="${TAG#v}"
            SHOULD_BUILD=true

            echo "当前仓库没有 Release"
            echo "开始首次构建：${TAG}"

          # ------------------------------------------------------
          # 上游有新版本
          # ------------------------------------------------------
          elif [[ "${UPSTREAM_TAG}" != "${LOCAL_TAG}" ]]; then

            TAG="${UPSTREAM_TAG}"
            VERSION="${TAG#v}"
            SHOULD_BUILD=true

            echo "检测到新版本：${LOCAL_TAG} -> ${TAG}"

          # ------------------------------------------------------
          # 已经是最新版本
          # ------------------------------------------------------
          else

            TAG="${UPSTREAM_TAG}"
            VERSION="${TAG#v}"
            SHOULD_BUILD=false

            echo "当前已经是最新版本，无需构建"

          fi

          echo "========================================"
          echo "TAG=${TAG}"
          echo "VERSION=${VERSION}"
          echo "SHOULD_BUILD=${SHOULD_BUILD}"
          echo "========================================"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "local_tag=${LOCAL_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      # 只清理旧 Actions 运行记录，不创建任何提交
      - name: 删除旧流程记录
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 7
          keep_minimum_runs: 20


  # ============================================================
  # Linux / Windows 编译
  # ============================================================
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.goarm && format('-arm{0}', matrix.goarm) || '' }}

    needs: check

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      max-parallel: 13

      matrix:
        include:

          # ====================================================
          # Linux
          # ====================================================

          # amd64
          # 官方 DEFAULT_BUILD_TAGS
          - os: linux
            arch: amd64
            build_tags: default
            debian: amd64

          # arm64
          # 官方 DEFAULT_BUILD_TAGS
          - os: linux
            arch: arm64
            build_tags: default
            debian: arm64

          # 386
          - os: linux
            arch: "386"
            build_tags: others
            go386: sse2
            debian: i386

          # armv7
          - os: linux
            arch: arm
            build_tags: others
            goarm: "7"
            debian: armhf

          # armv6
          - os: linux
            arch: arm
            build_tags: others
            goarm: "6"
            debian: armel

          # mips
          - os: linux
            arch: mips
            build_tags: others
            gomips: hardfloat

          # mipsle
          - os: linux
            arch: mipsle
            build_tags: others
            gomips: hardfloat
            debian: mipsel

          # mips64
          - os: linux
            arch: mips64
            build_tags: others
            gomips64: hardfloat

          # mips64le
          - os: linux
            arch: mips64le
            build_tags: others
            gomips64: hardfloat
            debian: mips64el

          # riscv64
          - os: linux
            arch: riscv64
            build_tags: others
            debian: riscv64

          # loong64
          - os: linux
            arch: loong64
            build_tags: others
            debian: loongarch64

          # s390x
          - os: linux
            arch: s390x
            build_tags: others
            debian: s390x

          # ppc64le
          - os: linux
            arch: ppc64le
            build_tags: others
            debian: ppc64el

          # ====================================================
          # Windows
          # ====================================================

          # 官方 DEFAULT_BUILD_TAGS_WINDOWS
          - os: windows
            arch: amd64
            build_tags: windows

          - os: windows
            arch: "386"
            build_tags: windows


    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Setup Go
      # --------------------------------------------------------
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false

      # --------------------------------------------------------
      # 获取 sing-box
      # --------------------------------------------------------
      - name: 获取 sing-box ${{ needs.check.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.check.outputs.tag }}"

          echo "========================================"
          echo "获取 sing-box"
          echo "版本：${TAG}"
          echo "========================================"

          git clone \
            --depth 1 \
            --branch "${TAG}" \
            https://github.com/SagerNet/sing-box.git \
            sing-box

      # --------------------------------------------------------
      # 安装 Linux 基础依赖
      # --------------------------------------------------------
      - name: 安装 Linux 构建依赖
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            file \
            jq \
            git

      # --------------------------------------------------------
      # 设置官方 Build Tags
      # --------------------------------------------------------
      - name: 设置官方 Build Tags
        shell: bash
        working-directory: sing-box
        run: |
          set -euo pipefail

          case "${{ matrix.build_tags }}" in

            default)
              TAGS="$(cat release/DEFAULT_BUILD_TAGS)"
              ;;

            others)
              TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
              ;;

            windows)
              TAGS="$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)"
              ;;

            *)
              echo "::error::未知 build_tags：${{ matrix.build_tags }}"
              exit 1
              ;;

          esac

          echo "BUILD_TAGS=${TAGS}" >> "$GITHUB_ENV"

          echo "========================================"
          echo "BUILD_TAGS"
          echo "========================================"
          echo "${TAGS}"

      # --------------------------------------------------------
      # 设置官方 LDFLAGS
      # --------------------------------------------------------
      - name: 设置官方 LDFLAGS
        shell: bash
        working-directory: sing-box
        run: |
          set -euo pipefail

          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          echo "LDFLAGS_SHARED=${LDFLAGS_SHARED}" >> "$GITHUB_ENV"

          echo "========================================"
          echo "官方 LDFLAGS"
          echo "========================================"
          cat release/LDFLAGS

      # --------------------------------------------------------
      # Linux 编译
      #
      # 所有 Linux 架构使用 CGO_ENABLED=0。
      #
      # 这样可以避免：
      # - Chromium toolchain
      # - cronet-go
      # - 交叉 GCC
      # - glibc/musl 交叉编译器
      #
      # amd64 / arm64 使用官方 DEFAULT_BUILD_TAGS
      # 其他架构使用 DEFAULT_BUILD_TAGS_OTHERS
      # --------------------------------------------------------
      - name: 编译 Linux
        if: matrix.os == 'linux'
        shell: bash
        working-directory: sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GO386: ${{ matrix.go386 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips64 }}
        run: |
          set -euo pipefail

          mkdir -p dist

          VERSION="${{ needs.check.outputs.version }}"

          OUTPUT="sing-box-${VERSION}-linux-${GOARCH}"

          if [[ -n "${GOARM:-}" ]]; then
            OUTPUT="${OUTPUT}-arm${GOARM}"
          fi

          echo "========================================"
          echo "编译 Linux"
          echo "========================================"
          echo "VERSION=${VERSION}"
          echo "GOOS=${GOOS}"
          echo "GOARCH=${GOARCH}"
          echo "GOARM=${GOARM:-}"
          echo "GO386=${GO386:-}"
          echo "GOMIPS=${GOMIPS:-}"
          echo "GOMIPS64=${GOMIPS64:-}"
          echo "OUTPUT=${OUTPUT}"
          echo "========================================"

          go build \
            -v \
            -trimpath \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/${OUTPUT}" \
            ./cmd/sing-box

      # --------------------------------------------------------
      # Windows 编译
      #
      # 绝对不走 Linux cronet-go / Chromium toolchain。
      #
      # 使用：
      # release/DEFAULT_BUILD_TAGS_WINDOWS
      #
      # 官方说明 Windows 使用 with_purego。
      # --------------------------------------------------------
      - name: 编译 Windows
        if: matrix.os == 'windows'
        shell: bash
        working-directory: sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          mkdir -p dist

          VERSION="${{ needs.check.outputs.version }}"

          OUTPUT="sing-box-${VERSION}-windows-${GOARCH}.exe"

          echo "========================================"
          echo "编译 Windows"
          echo "========================================"
          echo "VERSION=${VERSION}"
          echo "GOOS=${GOOS}"
          echo "GOARCH=${GOARCH}"
          echo "BUILD_TAGS=${BUILD_TAGS}"
          echo "========================================"

          go build \
            -v \
            -trimpath \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/${OUTPUT}" \
            ./cmd/sing-box

      # --------------------------------------------------------
      # 文件检查
      # --------------------------------------------------------
      - name: 检查构建产物
        shell: bash
        working-directory: sing-box
        run: |
          set -euo pipefail

          echo "========================================"
          echo "构建产物"
          echo "========================================"

          find dist -maxdepth 1 -type f -print

          echo
          echo "========================================"
          echo "文件类型"
          echo "========================================"

          file dist/*

          echo
          echo "========================================"
          echo "文件大小"
          echo "========================================"

          du -h dist/*

          echo
          echo "========================================"
          echo "SHA256"
          echo "========================================"

          sha256sum dist/*

      # --------------------------------------------------------
      # 上传 Artifact
      # --------------------------------------------------------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ needs.check.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.goarm && format('-arm{0}', matrix.goarm) || '' }}
          path: sing-box/dist/*
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # 创建 DEB
  # ============================================================
  deb:
    name: 构建 Debian DEB

    needs:
      - check
      - build

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        include:

          - arch: amd64
            debian: amd64

          - arch: arm64
            debian: arm64

          - arch: "386"
            debian: i386

          - arch: arm
            goarm: "7"
            debian: armhf

          - arch: arm
            goarm: "6"
            debian: armel

          - arch: mipsle
            debian: mipsel

          - arch: mips64le
            debian: mips64el

          - arch: riscv64
            debian: riscv64

          - arch: loong64
            debian: loongarch64

          - arch: s390x
            debian: s390x

          - arch: ppc64le
            debian: ppc64el

    steps:

      # --------------------------------------------------------
      # 下载所有构建 Artifact
      # --------------------------------------------------------
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: sing-box-${{ needs.check.outputs.version }}-linux-${{ matrix.arch }}${{ matrix.goarm && format('-arm{0}', matrix.goarm) || '' }}
          path: input
          merge-multiple: true

      # --------------------------------------------------------
      # 检出 Release 资源
      # --------------------------------------------------------
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            Release
          sparse-checkout-cone-mode: true

      # --------------------------------------------------------
      # 安装 FPM
      # --------------------------------------------------------
      - name: 安装 FPM
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ruby \
            ruby-dev \
            build-essential

          sudo gem install --no-document fpm

      # --------------------------------------------------------
      # 创建 DEB
      # --------------------------------------------------------
      - name: 创建 DEB
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.check.outputs.version }}"
          DEB_VERSION="${VERSION//-/~}"

          mkdir -p package/usr/bin

          # 找到对应 sing-box 二进制
          BINARY="$(find input -maxdepth 1 -type f -name 'sing-box-*' ! -name '*.deb' | head -n 1)"

          if [[ -z "${BINARY}" ]]; then
            echo "::error::没有找到 sing-box 二进制"
            find input -type f -print
            exit 1
          fi

          echo "使用二进制：${BINARY}"

          cp "${BINARY}" package/usr/bin/sing-box

          chmod 0755 package/usr/bin/sing-box

          # ----------------------------------------------------
          # systemd
          # ----------------------------------------------------
          mkdir -p package/usr/lib/systemd/system

          if [[ -f Release/sing-box.service ]]; then
            cp Release/sing-box.service \
              package/usr/lib/systemd/system/sing-box.service
          fi

          if [[ -f Release/sing-box@.service ]]; then
            cp Release/sing-box@.service \
              package/usr/lib/systemd/system/sing-box@.service
          fi

          # ----------------------------------------------------
          # sysusers
          # ----------------------------------------------------
          if [[ -f Release/sing-box.sysusers ]]; then
            mkdir -p package/usr/lib/sysusers.d

            cp Release/sing-box.sysusers \
              package/usr/lib/sysusers.d/sing-box.conf
          fi

          # ----------------------------------------------------
          # udev
          # ----------------------------------------------------
          if [[ -f Release/sing-box.rules ]]; then
            mkdir -p package/usr/lib/udev/rules.d

            cp Release/sing-box.rules \
              package/usr/lib/udev/rules.d/99-sing-box.rules
          fi

          # ----------------------------------------------------
          # Bash completion
          # ----------------------------------------------------
          if [[ -f Release/sing-box.bash ]]; then
            mkdir -p package/usr/share/bash-completion/completions

            cp Release/sing-box.bash \
              package/usr/share/bash-completion/completions/sing-box
          fi

          # ----------------------------------------------------
          # Fish completion
          # ----------------------------------------------------
          if [[ -f Release/sing-box.fish ]]; then
            mkdir -p package/usr/share/fish/vendor_completions.d

            cp Release/sing-box.fish \
              package/usr/share/fish/vendor_completions.d/sing-box.fish
          fi

          # ----------------------------------------------------
          # Zsh completion
          # ----------------------------------------------------
          if [[ -f Release/sing-box.zsh ]]; then
            mkdir -p package/usr/share/zsh/vendor-completions

            cp Release/sing-box.zsh \
              package/usr/share/zsh/vendor-completions/_sing-box
          fi

          # ----------------------------------------------------
          # LICENSE
          # ----------------------------------------------------
          if [[ -f Release/LICENSE ]]; then
            mkdir -p package/usr/share/doc/sing-box

            cp Release/LICENSE \
              package/usr/share/doc/sing-box/LICENSE
          fi

          # ----------------------------------------------------
          # split DNS
          # ----------------------------------------------------
          if [[ -f Release/sing-box-split-dns.xml ]]; then
            mkdir -p package/usr/share/sing-box

            cp Release/sing-box-split-dns.xml \
              package/usr/share/sing-box/
          fi

          # ----------------------------------------------------
          # postinst
          # ----------------------------------------------------
          POSTINST=""

          if [[ -f Release/sing-box.postinst ]]; then
            chmod +x Release/sing-box.postinst
            POSTINST="--after-install Release/sing-box.postinst"
          fi

          # ----------------------------------------------------
          # FPM
          # ----------------------------------------------------
          fpm \
            -s dir \
            -t deb \
            --name sing-box \
            --version "${DEB_VERSION}" \
            --architecture "${{ matrix.debian }}" \
            --description "The universal proxy platform" \
            --license "GPL-3.0" \
            --url "https://github.com/SagerNet/sing-box" \
            --maintainer "SagerNet" \
            ${POSTINST} \
            -C package \
            -p "sing-box_${DEB_VERSION}_${{ matrix.debian }}.deb" \
            .

          mkdir -p dist

          mv \
            "sing-box_${DEB_VERSION}_${{ matrix.debian }}.deb" \
            dist/

          echo "========================================"
          echo "DEB 构建完成"
          echo "========================================"

          ls -lh dist/

          file dist/*

          sha256sum dist/*

      # --------------------------------------------------------
      # 上传 DEB
      # --------------------------------------------------------
      - name: 上传 DEB
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ needs.check.outputs.version }}-deb-${{ matrix.debian }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # 汇总
  # ============================================================
  collect:
    name: 汇总所有产物

    needs:
      - check
      - build
      - deb

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-24.04

    steps:

      - name: 下载所有二进制
        uses: actions/download-artifact@v4
        with:
          pattern: sing-box-${{ needs.check.outputs.version }}-linux-*
          path: release
          merge-multiple: true

      - name: 下载 Windows
        uses: actions/download-artifact@v4
        with:
          pattern: sing-box-${{ needs.check.outputs.version }}-windows-*
          path: release
          merge-multiple: true

      - name: 下载 DEB
        uses: actions/download-artifact@v4
        with:
          pattern: sing-box-${{ needs.check.outputs.version }}-deb-*
          path: release
          merge-multiple: true

      - name: 检查 Release 文件
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "全部 Release 文件"
          echo "========================================"

          find release -maxdepth 1 -type f -printf '%f\n' | sort

          COUNT="$(find release -maxdepth 1 -type f | wc -l)"

          echo
          echo "文件数量：${COUNT}"

          if [[ "${COUNT}" -eq 0 ]]; then
            echo "::error::没有找到任何 Release 文件"
            exit 1
          fi

      - name: 生成 SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd release

          sha256sum * > sha256sums.txt

          echo "========================================"
          echo "SHA256"
          echo "========================================"

          cat sha256sums.txt

      - name: 生成构建信息
        shell: bash
        run: |
          set -euo pipefail

          cat > release/build-info.txt <<EOF
          Project: sing-box
          Version: ${{ needs.check.outputs.tag }}
          Build Version: ${{ needs.check.outputs.version }}
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Build Time: $(date '+%Y-%m-%d %H:%M:%S %Z')
          EOF

          cat release/build-info.txt

      - name: 上传最终 Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-release-${{ needs.check.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # 发布 Release
  # ============================================================
  release:
    name: 发布 GitHub Release

    needs:
      - check
      - collect

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-24.04

    steps:

      - name: 下载最终产物
        uses: actions/download-artifact@v4
        with:
          name: sing-box-release-${{ needs.check.outputs.version }}
          path: release

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}

          tag_name: ${{ needs.check.outputs.tag }}

          name: sing-box ${{ needs.check.outputs.tag }}

          target_commitish: ${{ github.sha }}

          generate_release_notes: true

          fail_on_unmatched_files: true

          files: |
            release/*

          body: |
            # sing-box ${{ needs.check.outputs.tag }}

            基于官方 SagerNet/sing-box 构建。

            官方项目：
            https://github.com/SagerNet/sing-box

            ## Linux

            - amd64
            - arm64
            - 386
            - armv7
            - armv6
            - mips
            - mipsle
            - mips64
            - mips64le
            - riscv64
            - loong64
            - s390x
            - ppc64le

            ## Windows

            - amd64
            - 386

            ## Debian

            - amd64
            - arm64
            - i386
            - armhf
            - armel
            - mipsel
            - mips64el
            - riscv64
            - loongarch64
            - s390x
            - ppc64el

            ## 构建说明

            Linux amd64 / arm64 使用：
            `release/DEFAULT_BUILD_TAGS`

            其他 Linux 架构使用：
            `release/DEFAULT_BUILD_TAGS_OTHERS`

            Windows 使用：
            `release/DEFAULT_BUILD_TAGS_WINDOWS`

            Linker flags 使用官方：
            `release/LDFLAGS`

            ## 校验

            SHA256：
            `sha256sums.txt`
