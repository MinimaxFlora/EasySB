name: 编译 sing-box

on:
  schedule:
    # UTC 03:00 / 20:00
    # 北京时间 11:00 / 次日 04:00
    - cron: "0 3,20 * * *"

  workflow_dispatch:
    inputs:
      branch:
        description: "指定编译版本，例如 1.14.1 或 v1.14.1；留空自动检测最新版本"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: sing-box-build
  cancel-in-progress: false

jobs:

  # ============================================================
  # 检查版本
  # ============================================================
  check:
    name: 检查版本
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.getversion.outputs.tag }}
      version: ${{ steps.getversion.outputs.version }}
      local_tag: ${{ steps.getversion.outputs.local_tag }}
      should_build: ${{ steps.getversion.outputs.should_build }}

    steps:
      - name: 获取版本
        id: getversion
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "检查 sing-box 版本"
          echo "========================================"

          # ------------------------------------------------------
          # 上游最新 Release
          # ------------------------------------------------------
          UPSTREAM_TAG="$(
            curl -sSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/SagerNet/sing-box/releases/latest" \
              | jq -r '.tag_name // empty'
          )"

          # ------------------------------------------------------
          # 当前仓库最新 Release
          #
          # 第一次运行没有 Release：
          # GitHub API 返回 404。
          #
          # 这里故意不使用 curl -f，
          # 因此 404 不会导致 workflow 直接失败。
          # ------------------------------------------------------
          LOCAL_TAG="$(
            curl -sSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
              | jq -r '.tag_name // empty'
          )"

          INPUT_VERSION="${{ inputs.branch }}"

          echo "========================================"
          echo "上游最新版本：${UPSTREAM_TAG:-获取失败}"
          echo "当前仓库版本：${LOCAL_TAG:-无 Release}"
          echo "手动指定版本：${INPUT_VERSION:-无}"
          echo "========================================"

          # ------------------------------------------------------
          # 手动指定版本
          # ------------------------------------------------------
          if [[ -n "${INPUT_VERSION}" ]]; then

            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
            SHOULD_BUILD=true

            echo "使用手动指定版本：${TAG}"

          # ------------------------------------------------------
          # 第一次构建
          # ------------------------------------------------------
          elif [[ -z "${LOCAL_TAG}" ]]; then

            if [[ -z "${UPSTREAM_TAG}" ]]; then
              echo "::error::无法获取 SagerNet/sing-box 最新版本"
              exit 1
            fi

            TAG="${UPSTREAM_TAG}"
            VERSION="${TAG#v}"
            SHOULD_BUILD=true

            echo "当前仓库没有 Release"
            echo "开始首次构建：${TAG}"

          # ------------------------------------------------------
          # 上游有新版本
          # ------------------------------------------------------
          elif [[ "${UPSTREAM_TAG}" != "${LOCAL_TAG}" ]]; then

            TAG="${UPSTREAM_TAG}"
            VERSION="${TAG#v}"
            SHOULD_BUILD=true

            echo "检测到新版本"
            echo "${LOCAL_TAG} -> ${TAG}"

          # ------------------------------------------------------
          # 已经是最新版本
          # ------------------------------------------------------
          else

            TAG="${UPSTREAM_TAG}"
            VERSION="${TAG#v}"
            SHOULD_BUILD=false

            echo "当前已经是最新版本，无需构建"

          fi

          echo "========================================"
          echo "TAG=${TAG}"
          echo "VERSION=${VERSION}"
          echo "SHOULD_BUILD=${SHOULD_BUILD}"
          echo "========================================"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "local_tag=${LOCAL_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # 清理旧 Actions 运行记录
      #
      # 这里只删除 Workflow Runs。
      # 不会创建 commit。
      # ----------------------------------------------------------
      - name: 删除旧流程记录
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 7
          keep_minimum_runs: 20


  # ============================================================
  # Linux / Windows 构建
  # ============================================================
  build:
    name: 构建 ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.goarm && format('-arm{0}', matrix.goarm) || '' }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}

    needs: check

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      max-parallel: 13

      matrix:
        include:

          # ====================================================
          # Linux
          # ====================================================

          # ----------------------------------------------------
          # amd64 purego
          # ----------------------------------------------------
          - os: linux
            arch: amd64
            variant: purego
            naive: true
            debian: amd64

          # ----------------------------------------------------
          # amd64 musl
          # ----------------------------------------------------
          - os: linux
            arch: amd64
            variant: musl
            naive: true
            debian: amd64

          # ----------------------------------------------------
          # arm64 purego
          # ----------------------------------------------------
          - os: linux
            arch: arm64
            variant: purego
            naive: true
            debian: arm64

          # ----------------------------------------------------
          # arm64 musl
          # ----------------------------------------------------
          - os: linux
            arch: arm64
            variant: musl
            naive: true
            debian: arm64

          # ----------------------------------------------------
          # 386 musl
          # ----------------------------------------------------
          - os: linux
            arch: "386"
            variant: musl
            naive: true
            go386: sse2
            debian: i386

          # ----------------------------------------------------
          # armv7 musl
          # ----------------------------------------------------
          - os: linux
            arch: arm
            variant: musl
            naive: true
            goarm: "7"
            debian: armhf

          # ----------------------------------------------------
          # armv6
          # ----------------------------------------------------
          - os: linux
            arch: arm
            variant: other
            goarm: "6"
            debian: armel

          # ----------------------------------------------------
          # mipsle
          # ----------------------------------------------------
          - os: linux
            arch: mipsle
            variant: musl
            naive: true
            gomips: softfloat
            debian: mipsel

          # ----------------------------------------------------
          # mips64le
          # ----------------------------------------------------
          - os: linux
            arch: mips64le
            variant: other
            debian: mips64el

          # ----------------------------------------------------
          # riscv64
          # ----------------------------------------------------
          - os: linux
            arch: riscv64
            variant: musl
            naive: true
            debian: riscv64

          # ----------------------------------------------------
          # loong64
          # ----------------------------------------------------
          - os: linux
            arch: loong64
            variant: musl
            naive: true
            debian: loongarch64

          # ----------------------------------------------------
          # s390x
          # ----------------------------------------------------
          - os: linux
            arch: s390x
            variant: other
            debian: s390x

          # ----------------------------------------------------
          # ppc64le
          # ----------------------------------------------------
          - os: linux
            arch: ppc64le
            variant: other
            debian: ppc64el

          # ====================================================
          # Windows
          # ====================================================

          - os: windows
            arch: amd64
            variant: windows

          - os: windows
            arch: "386"
            variant: windows


    steps:

      # --------------------------------------------------------
      # Checkout 当前仓库
      # --------------------------------------------------------
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # 获取 sing-box 源码
      # --------------------------------------------------------
      - name: 获取 sing-box ${{ needs.check.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.check.outputs.tag }}"

          echo "克隆 sing-box ${TAG}"

          git clone \
            --depth 1 \
            --branch "${TAG}" \
            https://github.com/SagerNet/sing-box.git \
            sing-box

      # --------------------------------------------------------
      # Setup Go
      # --------------------------------------------------------
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false

      # --------------------------------------------------------
      # 安装 Linux 构建依赖
      # --------------------------------------------------------
      - name: 安装 Linux 构建依赖
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            file \
            jq \
            git

      # --------------------------------------------------------
      # 获取 cronet-go
      #
      # naive 架构按照 sing-box 官方构建方式处理。
      # --------------------------------------------------------
      - name: 获取 cronet-go
        if: matrix.naive == true
        shell: bash
        working-directory: sing-box
        run: |
          set -xeuo pipefail

          CRONET_GO_VERSION="$(cat .github/CRONET_GO_VERSION)"

          echo "CRONET_GO_VERSION=${CRONET_GO_VERSION}"

          git init "${HOME}/cronet-go"

          git -C "${HOME}/cronet-go" \
            remote add origin \
            https://github.com/sagernet/cronet-go.git

          git -C "${HOME}/cronet-go" \
            fetch \
            --depth=1 \
            origin \
            "${CRONET_GO_VERSION}"

          git -C "${HOME}/cronet-go" \
            checkout FETCH_HEAD

          git -C "${HOME}/cronet-go" \
            submodule update \
            --init \
            --recursive \
            --depth=1

      # --------------------------------------------------------
      # Debian keyring
      # --------------------------------------------------------
      - name: 重新生成 Debian keyring
        if: matrix.naive == true
        shell: bash
        run: |
          set -xeuo pipefail

          KEYRING="${HOME}/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg"

          rm -f "${KEYRING}"

          cd "${HOME}/cronet-go"

          GPG_TTY=/dev/null \
            ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      # --------------------------------------------------------
      # Chromium toolchain Cache
      # --------------------------------------------------------
      - name: 缓存 Chromium toolchain
        if: matrix.naive == true
        uses: actions/cache@v4
        with:
          path: |
            ~/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/cronet-go/naiveproxy/src/gn/out/
            ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-toolchain-${{ matrix.arch }}-musl-${{ hashFiles('sing-box/.github/CRONET_GO_VERSION') }}

      # --------------------------------------------------------
      # 下载 Chromium toolchain
      # --------------------------------------------------------
      - name: 下载 Chromium toolchain
        if: matrix.naive == true
        shell: bash
        run: |
          set -xeuo pipefail

          cd "${HOME}/cronet-go"

          go run ./cmd/build-naive \
            --target=linux/${{ matrix.arch }} \
            --libc=musl \
            download-toolchain

      # --------------------------------------------------------
      # 设置 Chromium 环境
      # --------------------------------------------------------
      - name: 设置 Chromium toolchain 环境
        if: matrix.naive == true
        shell: bash
        run: |
          set -xeuo pipefail

          cd "${HOME}/cronet-go"

          go run ./cmd/build-naive \
            --target=linux/${{ matrix.arch }} \
            --libc=musl \
            env >> "${GITHUB_ENV}"

      # --------------------------------------------------------
      # 设置构建参数
      # --------------------------------------------------------
      - name: 设置构建 Tags
        shell: bash
        working-directory: sing-box
        run: |
          set -xeuo pipefail

          if [[ "${{ matrix.os }}" == "windows" ]]; then

            TAGS="$(cat release/DEFAULT_BUILD_TAGS_WINDOWS)"

          elif [[ "${{ matrix.naive }}" == "true" ]]; then

            TAGS="$(cat release/DEFAULT_BUILD_TAGS),with_musl"

          else

            TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"

          fi

          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"

          echo "BUILD_TAGS=${TAGS}"

      # --------------------------------------------------------
      # 设置官方 LDFLAGS
      # --------------------------------------------------------
      - name: 设置官方 LDFLAGS
        shell: bash
        working-directory: sing-box
        run: |
          set -euo pipefail

          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          echo "LDFLAGS_SHARED=${LDFLAGS_SHARED}" >> "${GITHUB_ENV}"

          echo "官方 LDFLAGS："
          cat release/LDFLAGS

      # --------------------------------------------------------
      # Linux naive / CGO 构建
      # --------------------------------------------------------
      - name: 构建 Linux naive
        if: matrix.os == 'linux' && matrix.naive == true
        shell: bash
        working-directory: sing-box
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          GO386: ${{ matrix.go386 }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips }}
        run: |
          set -xeuo pipefail

          mkdir -p dist

          go build \
            -v \
            -trimpath \
            -o dist/sing-box \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.check.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      # --------------------------------------------------------
      # Linux non-naive 构建
      # --------------------------------------------------------
      - name: 构建 Linux non-naive
        if: matrix.os == 'linux' && matrix.naive != true
        shell: bash
        working-directory: sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          GO386: ${{ matrix.go386 }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips }}
        run: |
          set -xeuo pipefail

          mkdir -p dist

          go build \
            -v \
            -trimpath \
            -o dist/sing-box \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.check.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      # --------------------------------------------------------
      # Windows 构建
      # --------------------------------------------------------
      - name: 构建 Windows
        if: matrix.os == 'windows'
        shell: bash
        working-directory: sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
        run: |
          set -xeuo pipefail

          mkdir -p dist

          go build \
            -v \
            -trimpath \
            -o dist/sing-box.exe \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.check.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      # --------------------------------------------------------
      # 固定 mtime
      # --------------------------------------------------------
      - name: 固定文件时间
        if: matrix.os == 'linux'
        shell: bash
        working-directory: sing-box
        run: |
          TZ=UTC touch -t '197001010000' dist/sing-box

      # --------------------------------------------------------
      # 设置 Debian 版本
      # --------------------------------------------------------
      - name: 设置 DEB 版本
        if: matrix.debian != ''
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION="${{ needs.check.outputs.version }}"

          # Debian 版本不能直接使用 -
          PKG_VERSION="${PKG_VERSION//-/~}"

          echo "PKG_VERSION=${PKG_VERSION}" >> "${GITHUB_ENV}"

      # --------------------------------------------------------
      # 创建 DEB
      # --------------------------------------------------------
      - name: 创建 DEB
        if: matrix.debian != ''
        shell: bash
        working-directory: sing-box
        run: |
          set -xeuo pipefail

          sudo gem install fpm

          # 使用官方 .fpm_systemd
          cp .fpm_systemd .fpm

          fpm \
            -t deb \
            --name "sing-box" \
            -v "${PKG_VERSION}" \
            -p "dist/sing-box_${{ needs.check.outputs.version }}_linux_${{ matrix.debian }}.deb" \
            --architecture "${{ matrix.debian }}" \
            dist/sing-box=/usr/bin/sing-box

      # --------------------------------------------------------
      # 显示产物
      # --------------------------------------------------------
      - name: 检查构建产物
        shell: bash
        working-directory: sing-box
        run: |
          set -euo pipefail

          echo "========================================"
          echo "构建完成"
          echo "========================================"

          ls -lah dist/

          echo
          echo "========================================"
          echo "文件类型"
          echo "========================================"

          file dist/*

          echo
          echo "========================================"
          echo "SHA256"
          echo "========================================"

          sha256sum dist/*

      # --------------------------------------------------------
      # 上传 Artifact
      # --------------------------------------------------------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ needs.check.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.goarm && format('-arm{0}', matrix.goarm) || '' }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          path: sing-box/dist/*
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # 汇总所有构建结果
  # ============================================================
  collect:
    name: 汇总构建产物
    needs:
      - check
      - build

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: sing-box-${{ needs.check.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: 检查所有产物
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "全部 Release 产物"
          echo "========================================"

          find dist -maxdepth 1 -type f -print

          echo
          echo "数量：$(find dist -maxdepth 1 -type f | wc -l)"

      - name: 生成 SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          sha256sum * > sha256sums.txt

          echo "========================================"
          cat sha256sums.txt
          echo "========================================"

      - name: 生成构建信息
        shell: bash
        run: |
          set -euo pipefail

          cat > dist/build-info.txt <<EOF
          Project: sing-box
          Version: ${{ needs.check.outputs.tag }}
          Build Version: ${{ needs.check.outputs.version }}
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Build Time: $(date '+%Y-%m-%d %H:%M:%S %Z')
          EOF

          cat dist/build-info.txt

      - name: 上传最终产物
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-release-${{ needs.check.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # 发布 GitHub Release
  # ============================================================
  release:
    name: 发布 Release
    needs:
      - check
      - collect

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: 下载最终产物
        uses: actions/download-artifact@v4
        with:
          name: sing-box-release-${{ needs.check.outputs.version }}
          path: release

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}

          tag_name: ${{ needs.check.outputs.tag }}

          name: sing-box ${{ needs.check.outputs.tag }}

          target_commitish: ${{ github.sha }}

          generate_release_notes: true

          fail_on_unmatched_files: true

          files: |
            release/*

          body: |
            # sing-box ${{ needs.check.outputs.tag }}

            基于官方
            `SagerNet/sing-box ${{ needs.check.outputs.tag }}`
            构建。

            ## 支持平台

            ### Linux

            - amd64
            - arm64
            - 386
            - armv7
            - armv6
            - mipsle
            - mips64le
            - riscv64
            - loong64
            - s390x
            - ppc64le

            ### Windows

            - amd64
            - 386

            ## Debian

            - amd64
            - arm64
            - i386
            - armhf
            - armel
            - mipsel
            - mips64el
            - riscv64
            - loongarch64
            - s390x
            - ppc64el

            ## 构建信息

            上游项目：

            https://github.com/SagerNet/sing-box

            版本：

            `${{ needs.check.outputs.tag }}`

            构建时间：

            `$(date '+%Y-%m-%d %H:%M:%S %Z')`

            ## SHA256

            请查看 Release 中的：

            `sha256sums.txt`
            
