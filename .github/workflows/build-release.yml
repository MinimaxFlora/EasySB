name: Build releases

on:
  schedule:
    - cron: "0 3,20 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: '指定编译的版本号 (例如 v1.14.1，留空则自动获取最新)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai
  BRANCH: ${{ github.event.inputs.branch }}

jobs:
  check:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.getversion.outputs.tag }}
      ver: ${{ steps.getversion.outputs.ver }}
    steps:
      - name: 获取版本号
        id: getversion
        run: |
          ver="$(curl -s https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest | jq -r '.tag_name')"
          tag="$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')"
          echo -e "获取到最新的版本号：${tag}\n当前仓库最新版本号：${ver}"
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          echo "ver=${ver}" >> $GITHUB_OUTPUT

      - name: 删除流程记录
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 0

  build:
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check.outputs.tag != needs.check.outputs.ver }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux x86 / x64 ---
          - target: amd64
            os: linux
            arch: amd64
            naive: true
            debian: amd64
            rpm: x86_64

          - target: linux-386-sse2
            os: linux
            arch: "386"
            go386: sse2
            debian: i386
            rpm: i386

          - target: linux-386-softfloat
            os: linux
            arch: "386"
            go386: softfloat

          # --- Linux ARM ---
          - target: arm64
            os: linux
            arch: arm64
            naive: true
            debian: arm64
            rpm: aarch64

          - target: armv7l
            os: linux
            arch: arm
            goarm: "7"
            naive: true
            debian: armhf
            rpm: armv7hl

          - target: armv6
            os: linux
            arch: arm
            goarm: "6"
            debian: armel
            rpm: armv6hl

          - target: armv5l
            os: linux
            arch: arm
            goarm: "5"

          # --- Linux MIPS ---
          - target: mipsel-hardfloat
            os: linux
            arch: mipsle
            gomips: hardfloat

          - target: mipsel-softfloat
            os: linux
            arch: mipsle
            gomips: softfloat
            debian: mipsel
            rpm: mipsel

          - target: mips64le-hardfloat
            os: linux
            arch: mips64le
            gomips: hardfloat
            debian: mips64el
            rpm: mips64el

          - target: mips64le-softfloat
            os: linux
            arch: mips64le
            gomips: softfloat

          - target: mips
            os: linux
            arch: mips
            gomips: softfloat

          - target: mips64
            os: linux
            arch: mips64
            gomips: softfloat

          # --- RISC-V / LoongArch / PowerPC / S390x ---
          - target: riscv64
            os: linux
            arch: riscv64
            debian: riscv64
            rpm: riscv64

          - target: loong64
            os: linux
            arch: loong64
            debian: loongarch64
            rpm: loongarch64

          - target: ppc64le
            os: linux
            arch: ppc64le
            debian: ppc64el
            rpm: ppc64le

          - target: s390x
            os: linux
            arch: s390x
            debian: s390x
            rpm: s390x

          # --- FreeBSD ---
          - target: freebsd-x86-64
            os: freebsd
            arch: amd64

          # --- Windows ---
          - target: windows-amd64
            os: windows
            arch: amd64
            naive: true

          - target: windows-arm64
            os: windows
            arch: arm64
            naive: true

          - target: windows-386
            os: windows
            arch: "386"

    runs-on: ubuntu-26.04
    steps:
      - name: 获取最新 Go 环境
        run: |
          latest_version=$(curl -L -k -s https://golang.org/dl/?mode=json | grep -m 1 -o '"version": "[^"]*' | sed 's/"version": "//' | tr -d 'go" ')
          echo "go版本=$latest_version"
          echo "gotag=$latest_version" >> $GITHUB_ENV

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.gotag }}

      - name: 检查代码仓库
        uses: actions/checkout@v4

      - name: 安装 UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: v4.2.4
          install-only: true

      - name: 编译 sing-box
        run: |
          if [[ -n "${{ github.event.inputs.branch }}" ]]; then
              TAG=${{ github.event.inputs.branch }}
          else
              TAG=${{ needs.check.outputs.tag }}
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          PKG_VERSION=${TAG#v}
          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV

          echo "开始拉取 ${TAG} 源码..."
          git clone -b ${TAG} https://github.com/SagerNet/sing-box /opt/sing-box

          mkdir -p /opt/sing-box/dist
          cd /opt/sing-box
          sudo timedatectl set-timezone "Asia/Shanghai"

          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            EXT=".exe"
          fi

          REL_DIR="release"
          if [ -d "Release" ]; then REL_DIR="Release"; fi

          BUILD_TAGS=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            if [ "${{ matrix.naive }}" = "true" ] && [ -f "$REL_DIR/DEFAULT_BUILD_TAGS_WINDOWS" ]; then
              BUILD_TAGS=$(cat "$REL_DIR/DEFAULT_BUILD_TAGS_WINDOWS" | tr -d '\r\n')
            elif [ -f "$REL_DIR/DEFAULT_BUILD_TAGS_OTHERS" ]; then
              BUILD_TAGS=$(cat "$REL_DIR/DEFAULT_BUILD_TAGS_OTHERS" | tr -d '\r\n')
            fi
          else
            if [ "${{ matrix.naive }}" = "true" ] && [ -f "$REL_DIR/DEFAULT_BUILD_TAGS" ]; then
              BUILD_TAGS=$(cat "$REL_DIR/DEFAULT_BUILD_TAGS" | tr -d '\r\n')
            elif [ -f "$REL_DIR/DEFAULT_BUILD_TAGS_OTHERS" ]; then
              BUILD_TAGS=$(cat "$REL_DIR/DEFAULT_BUILD_TAGS_OTHERS" | tr -d '\r\n')
            fi
          fi

          LDFLAGS_SHARED=""
          if [ -f "$REL_DIR/LDFLAGS" ]; then
            LDFLAGS_SHARED=$(cat "$REL_DIR/LDFLAGS" | tr -d '\r\n')
          fi

          if [ -z "$BUILD_TAGS" ]; then
            BUILD_TAGS="with_quic,with_grpc,with_dhcp,with_wireguard,with_ech,with_utls,with_reality_server,with_clash_api,with_gvisor"
          fi

          if [ "${{ matrix.naive }}" = "true" ] && [ "${{ matrix.os }}" = "linux" ]; then
            if [[ ",$BUILD_TAGS," != *",with_purego,"* ]]; then
              BUILD_TAGS="${BUILD_TAGS},with_purego"
            fi
          fi

          echo "目标架构: ${{ matrix.target }}"
          echo "使用编译 Tags: $BUILD_TAGS"
          echo "使用编译 LDFLAGS: $LDFLAGS_SHARED"

          GOOS=${{ matrix.os }} \
          GOARCH=${{ matrix.arch }} \
          GO386=${{ matrix.go386 }} \
          GOARM=${{ matrix.goarm }} \
          GOMIPS=${{ matrix.gomips }} \
          CGO_ENABLED=0 \
          go build -v -trimpath -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${PKG_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/sing-box${EXT}" ./cmd/sing-box

          file "dist/sing-box${EXT}"
          du -k "dist/sing-box${EXT}"

          # 提取依赖动态库 (libcronet.dll / libcronet.so)
          if [ "${{ matrix.naive }}" = "true" ]; then
            CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION 2>/devnull || echo "")
            if [ -n "$CRONET_GO_VERSION" ]; then
              if [ "${{ matrix.os }}" = "windows" ]; then
                LIBRARY_PATH="lib/windows_${{ matrix.arch }}/libcronet.dll"
              else
                LIBRARY_PATH="lib/linux_${{ matrix.arch }}/libcronet.so"
              fi
              git init "$RUNNER_TEMP/cronet-go-lib"
              git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
              git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
              git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION" || true
              git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD || true
              if [ -f "$RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" ]; then
                cp "$RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" dist/
              fi
            fi
          fi

          # 生成 UPX 压缩后的文件 (仅限支持 UPX 的架构)
          TARGET_NAME="${{ matrix.target }}"
          if [[ "$TARGET_NAME" != *"mips64"* ]] && [[ "$TARGET_NAME" != *"s390x"* ]] && [[ "$TARGET_NAME" != *"freebsd"* ]] && [[ "$TARGET_NAME" != *"riscv64"* ]] && [[ "$TARGET_NAME" != *"loong64"* ]]; then
            cp "dist/sing-box${EXT}" "dist/sing-box-upx${EXT}"
            upx --lzma --best "dist/sing-box-upx${EXT}" || true
            du -k "dist/sing-box-upx${EXT}"
          fi

          echo "build_time=$(date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV

      - name: 打包 DEB
        if: matrix.debian != '' && matrix.debian != null
        run: |
          set -xeuo pipefail
          sudo gem install fpm
          sudo apt-get install -y debsigs
          cd /opt/sing-box

          REL_DIR="release"
          if [ -d "Release" ]; then REL_DIR="Release"; fi
          if [ -f "$REL_DIR/.fpm_systemd" ]; then cp "$REL_DIR/.fpm_systemd" .fpm; fi

          fpm -s dir -t deb \
            -n sing-box \
            -v "${{ env.PKG_VERSION }}" \
            -p "dist/sing-box_${{ env.PKG_VERSION }}_${{ matrix.os }}_${{ matrix.debian }}.deb" \
            --architecture ${{ matrix.debian }} \
            dist/sing-box=/usr/bin/sing-box

          if [ -n "${{ secrets.GPG_KEY }}" ]; then
            rm -rf $HOME/.gnupg
            echo "${{ secrets.GPG_KEY }}" | gpg --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --import
            debsigs --sign=origin -k ${{ secrets.GPG_KEY_ID }} --gpgopts '--batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}"' dist/*.deb
          else
            echo "Skipping GPG signature (GPG_KEY is not configured in repository secrets)."
          fi

      - name: 打包 RPM
        if: matrix.rpm != '' && matrix.rpm != null
        run: |
          set -xeuo pipefail
          sudo gem install fpm
          sudo apt-get install -y rpm
          cd /opt/sing-box

          REL_DIR="release"
          if [ -d "Release" ]; then REL_DIR="Release"; fi
          if [ -f "$REL_DIR/.fpm_systemd" ]; then cp "$REL_DIR/.fpm_systemd" .fpm; fi

          fpm -s dir -t rpm \
            -n sing-box \
            -v "${{ env.PKG_VERSION }}" \
            -p "dist/sing-box_${{ env.PKG_VERSION }}_${{ matrix.os }}_${{ matrix.rpm }}.rpm" \
            --architecture ${{ matrix.rpm }} \
            dist/sing-box=/usr/bin/sing-box

          if [ -n "${{ secrets.GPG_KEY }}" ]; then
            echo "%_rpmformat 4" > $HOME/.rpmmacros
            echo "%_gpg_name ${{ secrets.GPG_KEY_ID }}" >> $HOME/.rpmmacros
            echo "%_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase ${{ secrets.GPG_PASSPHRASE }}" >> $HOME/.rpmmacros
            echo "${{ secrets.GPG_KEY }}" | gpg --batch --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --import
            rpmsign --addsign dist/*.rpm
          else
            echo "Skipping GPG signature (GPG_KEY is not configured in repository secrets)."
          fi

      - name: qemu-mipsel 运行测试
        if: matrix.target == 'mipsel-softfloat'
        run: |
          curl -sL -o /tmp/qemu-mipsel-static "https://github.com/multiarch/qemu-user-static/releases/download/v7.2.0-1/qemu-mipsel-static"
          chmod +x /tmp/qemu-mipsel-static
          cd /opt/sing-box
          echo "===== sing-box-mipsel version (qemu-mipsel) ====="
          if ! /tmp/qemu-mipsel-static dist/sing-box version > /tmp/help.txt 2>&1; then
            echo "::error::qemu-mipsel 运行 sing-box 失败"
            cat /tmp/help.txt
            exit 1
          fi
          cat /tmp/help.txt
          grep -qi "sing-box" /tmp/help.txt || { echo "::error::sing-box-mipsel 输出异常"; exit 1; }

      - name: 打包压缩包 (tar.gz/zip) 并清理裸文件
        run: |
          cd /opt/sing-box

          # 计算标准完整架构名称
          if [[ "${{ matrix.target }}" == "${{ matrix.os }}"* ]]; then
            FULL_TARGET="${{ matrix.target }}"
          else
            FULL_TARGET="${{ matrix.os }}-${{ matrix.target }}"
          fi

          ARCHIVE_NAME="sing-box-${{ env.PKG_VERSION }}-${FULL_TARGET}"
          ARCH_DIR="dist/${ARCHIVE_NAME}"

          mkdir -p "${ARCH_DIR}"

          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi

          # 拷贝主程序
          cp "dist/sing-box${EXT}" "${ARCH_DIR}/sing-box${EXT}"

          # 拷贝 UPX 压缩镜像 (如果存在)
          if [ -f "dist/sing-box-upx${EXT}" ]; then
            cp "dist/sing-box-upx${EXT}" "${ARCH_DIR}/sing-box-upx${EXT}"
          fi

          # 拷贝依赖的动态库与 LICENSE
          if [ -f "dist/libcronet.dll" ]; then cp "dist/libcronet.dll" "${ARCH_DIR}/"; fi
          if [ -f "dist/libcronet.so" ]; then cp "dist/libcronet.so" "${ARCH_DIR}/"; fi
          if [ -f "LICENSE" ]; then cp "LICENSE" "${ARCH_DIR}/"; fi

          # 打包为压缩包
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -r "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          else
            tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          fi

          # 清理解压文件夹及临时裸二进制文件，只留 .tar.gz / .zip 以及 .deb / .rpm
          rm -rf "${ARCHIVE_NAME}"
          rm -f sing-box sing-box.exe sing-box-upx sing-box-upx.exe libcronet.dll libcronet.so

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ env.TAG }}-${{ matrix.target }}
          path: /opt/sing-box/dist/

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          body: |
            > ### ![](https://img.shields.io/badge/%E7%BC%96%E8%AF%91%E6%97%B6%E9%97%B4-${{ env.build_time }}-8267?logo=github&labelColor=%E9%A1%BB)![](https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.TAG }}/total?label=%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&logo=github)

            压缩包内已包含二进制主程序及 UPX 压缩版本（如适用）。
            支持的主流 Linux 架构附带 `.deb` / `.rpm` 标准安装包。

            **[官方更新说明](https://github.com/SagerNet/sing-box/releases)**

          tag_name: ${{ env.TAG }}
          files: /opt/sing-box/dist/*
