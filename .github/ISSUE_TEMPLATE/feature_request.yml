name: 功能请求
description: 为 EasySB 提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        说明清楚要解决的问题，比直接给方案更有帮助。

  - type: dropdown
    id: component
    attributes:
      label: 涉及组件
      options:
        - EasySB 一键脚本
        - 配置模板
        - 订阅模板
        - CI 工作流
        - 文档
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前遇到什么困难，为什么现有功能无法覆盖
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望以什么方式使用它，交互上如何呈现
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法或替代工具
    validations:
      required: false
