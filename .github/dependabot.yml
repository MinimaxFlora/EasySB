version: 2

updates:
  # 维护 GitHub Actions 依赖版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
