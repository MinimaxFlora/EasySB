# Nginx 运行用户
user nginx;

# 工作进程数，设置为 auto 会根据服务器 CPU 核心数自动调整
worker_processes auto;

# 错误日志路径及记录级别（notice 级别）
error_log /var/log/nginx/error.log notice;

# Nginx 主进程 PID 文件的存放位置
pid /var/run/nginx.pid;

events {
    # 每个 worker 进程允许的最大并发连接数
    worker_connections 1024;
}

http {
    # 定义访问日志格式 main
    log_format main '[$time_local] $remote_addr "$http_referer" "$http_user_agent"';
    # 指定访问日志保存路径并启用 main 格式
    access_log /var/log/nginx/access.log main;

    # WebSocket 协议转换映射：如果客户端请求升级协议，则设置 Connection 头为 "upgrade"，否则为 "close"
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # 依据客户端 IP 格式拼装 RFC 7239 标准的 Forwarded 头元素（区分 IPv4/IPv6）
    map $remote_addr $proxy_forwarded_elem {
        ~^[0-9.]+$        "for=$remote_addr";
        ~^[0-9A-Fa-f:.]+$ "for=\"[$remote_addr]\"";
        default           "for=unknown";
    }

    # 构建并追加 Forwarded 请求头，保留多级代理链信息
    map $http_forwarded $proxy_add_forwarded {
        "~^(,[ \\t]*)*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*([ \\t]*,([ \\t]*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*)?)*$" "$http_forwarded, $proxy_forwarded_elem";
        default "$proxy_forwarded_elem";
    }

    # HTTP 80 端口服务：全站强制 301 重定向至 HTTPS
    server {
        listen 80;
        listen [::]:80;
        return 301 https://$host$request_uri;
    }

    # 默认 443 SSL 服务：防 SNI 探测/未绑定域名空头扫描
    server {
        listen                  443 ssl default_server;
        listen                  [::]:443 ssl default_server;

        # 拒绝未明确在 server_name 中匹配域名的 TLS 握手请求
        ssl_reject_handshake    on;

        ssl_protocols           TLSv1.2 TLSv1.3;

        ssl_session_timeout     1h;
        ssl_session_cache       shared:SSL:10m;
    }

    # 正式 HTTPS 业务/伪装站服务配置
    server {
        listen                      443 ssl;
        listen                      [::]:443 ssl;
        http2                       on; # 开启 HTTP/2 协议支持（1.25.1+ 语法，旧版本需写在 listen 指令末尾）

        # 绑定的域名列表，多个域名以空格分隔
        server_name                 example.com chika.example.com;

        # SSL 证书 fullchain 完整链与私钥路径
        ssl_certificate             /etc/ssl/private/fullchain.cer;
        ssl_certificate_key         /etc/ssl/private/private.key;

        # TLS 协议版本支持
        ssl_protocols               TLSv1.2 TLSv1.3;
        # 加密套件配置，优先使用安全性高、速度快的算法
        ssl_ciphers                 TLS13_AES_128_GCM_SHA256:TLS13_AES_256_GCM_SHA384:TLS13_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers   on;

        # 开启 OCSP Stapling（在线证书状态协议装订），优化客户端 SSL 握手延迟
        ssl_stapling                on;
        ssl_stapling_verify         on;
        resolver                    1.1.1.1 valid=60s; # 用于 OCSP 状态查询的 DNS 解析器
        resolver_timeout            2s;

        client_header_buffer_size   8k;

        # 精确匹配 /vmess 路径：专门用于 WebSocket 代理转发（如 sing-box / v2ray 等后端）
        location = /vmess {
            # 校验 Header：如果请求不是 WebSocket 升级请求，直接返回 404（增强伪装性）
            if ($http_upgrade != "websocket") {
                return 404;
            }

            # 转发给本地 8001 端口的后端代理程序
            proxy_pass                          http://127.0.0.1:8001;
            proxy_http_version                  1.1;
            # 设置 WebSocket 关键请求头
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            # 传递客户端真实 IP
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header Host               $host;
            proxy_redirect                      off;
        }

        # 默认根路径：反向代理真实外部网站作为“伪装主页”
        location / {
            # 将反向代理响应内容中的目标域名替换为当前访问的域名
            sub_filter                          $proxy_host $host;
            sub_filter_once                     off;

            # 定义被伪装的源站域名
            set $website                         www.lovelive-anime.jp;
            proxy_pass                          https://$website;
            resolver                            1.1.1.1; # 动态解析源站 IP 的 DNS

            # 设置发给源站的 Host 请求头为源站域名
            proxy_set_header Host               $proxy_host;

            proxy_http_version                  1.1;
            proxy_cache_bypass                  $http_upgrade;

            # 启用上游 HTTPS SNI，确保源站 SSL 握手正常
            proxy_ssl_server_name                 on;

            # 传递常规 Web 代理 Header 与客户端真实网络栈信息
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         $connection_upgrade;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header Forwarded          $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Forwarded-Host   $host;
            proxy_set_header X-Forwarded-Port   $server_port;

            # 反向代理超时时间配置
            proxy_connect_timeout               60s;
            proxy_send_timeout                  60s;
            proxy_read_timeout                  60s;
        }
    }
}
